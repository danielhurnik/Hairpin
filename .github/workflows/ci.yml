name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Includes the race-balance Monte Carlo, which asserts the favourite
      # wins ~65% of the time.
      - name: Test
        run: go test ./...

      # The detector only earns its keep where goroutines meet shared state:
      # the transactional economy and the HTTP layer. internal/game is pure
      # computation, and running it under -race costs 85s to prove nothing.
      - name: Test under race detector
        run: go test -race ./internal/store/... ./internal/api/... ./internal/auth/...

  geometry:
    name: Track geometry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The importer has no real road to check itself against in CI, so it
      # checks itself against shapes whose answers are known exactly: a circle
      # of radius R has to measure R, five linked hairpins have to come out as
      # five hairpins, and both have to survive GPS noise.
      - name: Geometry self-test
        run: python3 gen_tracks.py --self-test

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # Catches unresolved imports and expo-router route errors that
      # typechecking alone does not.
      - name: Bundle
        run: npx expo export --platform ios --output-dir /tmp/hairpin-bundle
